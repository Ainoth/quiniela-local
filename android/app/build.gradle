plugins { id 'com.android.application' }

android {
    namespace 'es.quinielalocal.app'
    compileSdk 33

    defaultConfig {
        applicationId 'es.quinielalocal.app'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
