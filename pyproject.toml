[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiniela-ai-studio"
version = "0.1.9"
description = "Estudio local de sistemas de Quiniela para Linux y Windows"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "platformdirs>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
quiniela-studio = "quiniela_ai_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quiniela_ai_studio*", "quiniela_studio*"]

[tool.setuptools]
py-modules = ["data_updater", "live_results", "quiniela_engine"]
package-dir = {"" = ".", "quiniela_ai_studio" = "src/quiniela_ai_studio", "quiniela_studio" = "src/quiniela_studio"}

[tool.pytest.ini_options]
testpaths = ["tests/studio"]
pythonpath = ["src", "."]
