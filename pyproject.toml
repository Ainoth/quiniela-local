[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiniela-ai-studio"
version = "0.1.1"
description = "Estudio local de sistemas de Quiniela para Linux y Windows"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
quiniela-studio = "quiniela_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["quiniela_studio*"]

[tool.setuptools]
py-modules = ["data_updater", "live_results", "quiniela_engine"]

[tool.pytest.ini_options]
testpaths = ["tests/studio"]
